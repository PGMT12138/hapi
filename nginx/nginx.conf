upstream hapi_hub {
    server 127.0.0.1:3006;
    keepalive 64;
}

# HTTP - keep plain HTTP access
server {
    listen 8680;
    server_name _;

    location = / {
        auth_basic "HAPI Login";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://hapi_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /download/hapi-webview.apk {
        alias /tmp/hapi-blobs/hapi-webview.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="hapi-webview.apk"';
    }

    location / {
        proxy_pass http://hapi_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}

# HTTPS with self-signed certificate
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location = / {
        auth_basic "HAPI Login";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://hapi_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /download/hapi-webview.apk {
        alias /tmp/hapi-blobs/hapi-webview.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="hapi-webview.apk"';
    }

    location / {
        proxy_pass http://hapi_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
